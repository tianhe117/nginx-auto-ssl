services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    network_mode: host
    entrypoint: /scripts/nginx-entrypoint.sh
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
      - ./scripts:/scripts:ro
      - certs:/opt/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  acme-sh:
    image: ghcr.io/acmesh-official/acme.sh:latest
    container_name: acme-sh
    restart: unless-stopped
    network_mode: host
    command: daemon
    stdin_open: true
    tty: true
    environment:
      - Ali_Key=${ALIYUN_AK_ID}
      - Ali_Secret=${ALIYUN_AK_SECRET}
    volumes:
      - certs:/acme.sh
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  certs:
